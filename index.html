<!DOCTYPE html>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>












<script>
/* ===== PORTOFOLIO FINAL CLEAN ===== */
(function(){
  'use strict';
  if (!window.db) window.db = {};
  if (!window.db.portfolios) window.db.portfolios = [];
  if (!window.db.portfolioSubmissions) window.db.portfolioSubmissions = [];

  function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]; }); }
  function getPortfolios(){ return window.db.portfolios || []; }
  function getSubmissions(){ return window.db.portfolioSubmissions || []; }

  window.savePortfolioTask = async function(){
    var titleEl = document.getElementById('portTitle');
    var title = titleEl ? String(titleEl.value || '').trim() : '';
    if (!title) { alert('Nama tugas wajib diisi'); return; }
    var item = {
      id: 'port_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
      title: title,
      kelas: (document.getElementById('portClass')||{}).value || 'all',
      instruksi: ((document.getElementById('portInstruksi')||{}).value || '').trim(),
      createdAt: Date.now()
    };
    getPortfolios().push(item);
    window.db.portfolios = getPortfolios();
    if (typeof saveDB === 'function') saveDB();
    if (titleEl) titleEl.value = '';
    var iel = document.getElementById('portInstruksi'); if (iel) iel.value = '';
    renderPortfolioAdmin();
    alert('Tugas tersimpan: ' + item.title);
    if (window.sb && navigator.onLine) {
      try {
        var row = { id: item.id, title: item.title, kelas: item.kelas, instruksi: item.instruksi, createdAt: item.createdAt, data: item };
        var res = await window.sb.from('portfolios').upsert(row, { onConflict: 'id' });
        if (res.error) alert('Gagal server: ' + res.error.message);
        else alert('Tersinkron');
      } catch(e) {}
    }
  };

  window.renderPortfolioAdmin = function(){
    var el = document.getElementById('portfolioAdminList');
    if (!el) return;
    var list = getPortfolios().slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    if (!list.length) { el.innerHTML = '<p class="muted">Belum ada tugas.</p>'; return; }
    var html = '';
    list.forEach(function(p){
      html += '<div style="border-left:4px solid #0b7a55;margin:10px 0;padding:12px;border-radius:12px;background:#fff">';
      html += '<b>' + esc(p.title) + '</b> <span class="pill">Kelas ' + esc(p.kelas==='all'?'Semua':p.kelas) + '</span>';
      html += '<div style="font-size:13px;margin:6px 0">' + esc(p.instruksi||'') + '</div>';
      html += '<button type="button" onclick="viewPortfolioSubmissions(\'' + p.id + '\')">Lihat Kiriman</button> ';
      html += '<button type="button" class="danger" onclick="deletePortfolioTask(\'' + p.id + '\')">Hapus</button>';
      html += '</div>';
    });
    el.innerHTML = html;
  };

  window.deletePortfolioTask = function(id){
    if (!confirm('Hapus?')) return;
    window.db.portfolios = getPortfolios().filter(function(p){ return p.id !== id; });
    if (typeof saveDB === 'function') saveDB();
    renderPortfolioAdmin();
  };

  window.viewPortfolioSubmissions = function(portId){
    var port = getPortfolios().find(function(p){ return p.id === portId; }) || {};
    var subs = getSubmissions().filter(function(s){ return s.portfolioId === portId; });
    var el = document.getElementById('portfolioSubmissionsView');
    if (!el) {
      el = document.createElement('div');
      el.id = 'portfolioSubmissionsView';
      var list = document.getElementById('portfolioAdminList');
      if (list && list.parentNode) list.parentNode.appendChild(el);
    }
    if (!subs.length) { el.innerHTML = '<div class="notice">Belum ada kiriman.</div>'; return; }
    var html = '<h3>Kiriman: ' + esc(port.title||'') + ' (' + subs.length + ')</h3>';
    html += '<button type="button" onclick="downloadPortfolioCSV(\'' + portId + '\')">Download Excel</button> ';
    html += '<button type="button" class="secondary" onclick="printPortfolioPDF(\'' + portId + '\')">Cetak PDF</button>';
    html += '<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Teks</th><th>File</th><th>Waktu</th></tr></thead><tbody>';
    subs.forEach(function(s){
      html += '<tr><td>' + esc(s.name) + '</td><td>' + esc(s.kelas) + '</td><td>' + esc(s.text||'') + '</td><td>' + esc(s.fileName||'-') + '</td><td>' + new Date(s.submittedAt||0).toLocaleString('id-ID') + '</td></tr>';
    });
    html += '</tbody></table></div>';
    el.innerHTML = html;
  };

  window.downloadPortfolioCSV = function(portId){
    var port = getPortfolios().find(function(p){ return p.id === portId; }) || {};
    var subs = getSubmissions().filter(function(s){ return s.portfolioId === portId; });
    var lines = [['Nama','Username','Kelas','Teks','File','Waktu']];
    subs.forEach(function(s){
      lines.push([s.name||'', s.username||'', s.kelas||'', (s.text||'').replace(/\n/g,' '), s.fileName||'', new Date(s.submittedAt||0).toLocaleString('id-ID')]);
    });
    var csv = lines.map(function(r){ return r.map(function(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'}));
    a.download = 'Portofolio_' + (port.title || 'tugas').replace(/[^a-z0-9]/gi,'_') + '.csv';
    a.click();
  };

  window.printPortfolioPDF = function(portId){
    var port = getPortfolios().find(function(p){ return p.id === portId; }) || {};
    var subs = getSubmissions().filter(function(s){ return s.portfolioId === portId; });
    var w = window.open('', '_blank');
    var h = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Portofolio</title><style>body{font-family:system-ui;padding:16px} table{width:100%;border-collapse:collapse;font-size:12px} th,td{border:1px solid #ccc;padding:5px} th{background:#f1f7f3}</style></head><body>';
    h += '<h2>' + esc(port.title||'') + '</h2><table><thead><tr><th>Nama</th><th>Kelas</th><th>Teks</th><th>File</th><th>Waktu</th></tr></thead><tbody>';
    subs.forEach(function(s){
      h += '<tr><td>' + esc(s.name) + '</td><td>' + esc(s.kelas) + '</td><td>' + esc(s.text||'') + '</td><td>' + esc(s.fileName||'-') + '</td><td>' + new Date(s.submittedAt||0).toLocaleString('id-ID') + '</td></tr>';
    });
    h += '</tbody></table></body></html>';
    w.document.write(h);
    w.document.close();
    setTimeout(function(){ w.print(); }, 400);
  };

  window.renderStudentPortfolio = function(){
    var el = document.getElementById('studentPortfolioList');
    if (!el) return;
    var grade = (window.current && window.current.kelas) ? String(window.current.kelas).charAt(0) : '';
    var list = getPortfolios().filter(function(p){
      return !p.kelas || p.kelas === 'all' || String(p.kelas) === grade;
    });
    if (!list.length) { el.innerHTML = '<p class="muted">Belum ada tugas untuk kelas kamu.</p>'; return; }
    var html = '';
    list.forEach(function(p){
      var my = getSubmissions().find(function(s){ return s.portfolioId === p.id && s.username === (window.current && window.current.username); });
      html += '<div style="border-left:4px solid #0b7a55;margin:10px 0;padding:12px;border-radius:12px;background:#fff">';
      html += '<b>' + esc(p.title) + '</b>';
      html += '<div style="font-size:13px;margin:6px 0">' + esc(p.instruksi||'') + '</div>';
      if (my) html += '<p class="muted">Sudah dikirim</p>';
      html += '<button type="button" onclick="openStudentPortfolioForm(\'' + p.id + '\')">' + (my ? 'Edit' : 'Kirim Tugas') + '</button>';
      html += '</div>';
    });
    el.innerHTML = html;
  };

  window.openStudentPortfolioForm = function(portId){
    var form = document.getElementById('studentPortfolioForm');
    if (!form) return;
    var port = getPortfolios().find(function(p){ return p.id === portId; });
    if (!port) return;
    form.classList.remove('hidden');
    form.innerHTML = '<h3>' + esc(port.title) + '</h3><p>' + esc(port.instruksi||'') + '</p>' +
      '<label>Tulisan</label><textarea id="portSubmitText" rows="4"></textarea>' +
      '<label>File</label><input type="file" id="portSubmitFile" accept="image/*,.pdf">' +
      '<div class="actions"><button type="button" onclick="submitPortfolio(\'' + portId + '\')">Kirim</button></div>';
  };

  window.submitPortfolio = function(portId){
    var text = (document.getElementById('portSubmitText').value || '').trim();
    var fileInput = document.getElementById('portSubmitFile');
    var file = fileInput && fileInput.files && fileInput.files[0];
    if (!text && !file) { alert('Isi tulisan atau pilih file'); return; }
    var item = {
      id: 'psub_' + Date.now(),
      portfolioId: portId,
      username: (window.current && window.current.username) || '',
      name: (window.current && window.current.name) || '',
      kelas: (window.current && window.current.kelas) || '',
      text: text,
      fileName: file ? file.name : '',
      submittedAt: Date.now()
    };
    var list = getSubmissions().filter(function(s){ return !(s.portfolioId===portId && s.username===item.username); });
    list.push(item);
    window.db.portfolioSubmissions = list;
    if (typeof saveDB === 'function') saveDB();
    document.getElementById('studentPortfolioForm').classList.add('hidden');
    renderStudentPortfolio();
    alert('Tugas terkirim');
  };

  var orig = window.showTab;
  window.showTab = function(id, btn){
    if (typeof orig === 'function') orig(id, btn);
    if (id === 'teacherPortfolio') renderPortfolioAdmin();
    if (id === 'studentPortfolio') renderStudentPortfolio();
  };
})();
</script>

</body>
</html>
